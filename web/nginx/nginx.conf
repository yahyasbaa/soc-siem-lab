# Lab web server (only reachable on the internal soc-hosts network).
# Logs are written to files (not stdout) so the lab-web-01 Wazuh agent can
# collect them from the shared runtime/hosts/lab-web-01/nginx directory.
user  nginx;
worker_processes  1;
error_log  /var/log/lab-nginx/error.log warn;
pid        /var/run/nginx.pid;

events { worker_connections 256; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    # Standard "combined" format: parsed by the Wazuh web-accesslog decoder
    log_format  combined_lab  '$remote_addr - $remote_user [$time_local] "$request" '
                              '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log  /var/log/lab-nginx/access.log  combined_lab;

    server {
        listen 80 default_server;
        server_name lab-web-01;
        root /usr/share/nginx/html;

        location = / { index index.html; }
        location = /healthz { access_log off; return 200 "ok\n"; }
        # Heartbeat endpoint used by scripts/health-check.sh to prove real
        # Nginx logs flow through the SIEM pipeline.
        location = /soc-lab-heartbeat { return 204; }
        # Hidden files are never served
        location ~ /\. { deny all; }
    }
}
